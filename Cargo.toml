[workspace]
resolver = "2"
members = [
    "crates/open-boom-core",
    "crates/open-boom-wasapi",
    "crates/open-boom-coreaudio",
    "crates/open-boom-storage",
    "src-tauri",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
authors = ["OpenBoom Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/open-boom/open-boom"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
windows = "0.58.0"
tauri = { version = "2.0", features = ["tray-icon"] }
libc = "0.2"
coreaudio-sys = { version = "0.2", default-features = false, features = ["core_audio"] }

[profile.test]
opt-level = 1

