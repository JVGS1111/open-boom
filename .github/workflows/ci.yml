name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Typecheck
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/open-boom-core
            crates/open-boom-wasapi
            crates/open-boom-coreaudio
            crates/open-boom-storage
            src-tauri

      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix src-ui ci

      - name: Run Cargo workspace tests
        run: cargo test --workspace --locked

      - name: Run Frontend unit tests
        run: npm run test

      - name: Verify Frontend production build
        run: npm run ui:build

      - name: Cargo check release
        run: cargo check --release --workspace

  macos-test:
    name: macOS CoreAudio Test (arm64)
    # Pin an Apple Silicon runner/target so the NEON path is the one actually compiled.
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/open-boom-core
            crates/open-boom-coreaudio
            crates/open-boom-storage
            src-tauri

      - name: Check off-Windows wasapi glue
        run: cargo check --locked --target aarch64-apple-darwin -p open-boom-wasapi

      - name: Build CoreAudio adapter (compiles the macOS FFI + NEON path)
        run: cargo build --locked --target aarch64-apple-darwin -p open-boom-coreaudio

      - name: Run platform-agnostic and CoreAudio tests
        run: |
          cargo test --locked --target aarch64-apple-darwin -p open-boom-core
          cargo test --locked --target aarch64-apple-darwin -p open-boom-coreaudio
          cargo test --locked --target aarch64-apple-darwin -p open-boom-storage
